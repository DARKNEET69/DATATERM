<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Auth Callback</title>
<style>
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
  background: #0d1117; 
  color: #c9d1d9; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  height: 100vh; 
  margin: 0; 
}
.loading { 
  text-align: center; 
  padding: 40px; 
}
.spinner { 
  border: 3px solid #30363d; 
  border-top: 3px solid #58a6ff; 
  border-radius: 50%; 
  width: 40px; 
  height: 40px; 
  animation: spin 1s linear infinite; 
  margin: 0 auto 20px; 
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.error { color: #f85149; }
.success { color: #3fb950; }
.oauth-inputs { 
  background: #161b22; 
  padding: 20px; 
  border-radius: 8px; 
  border: 1px solid #30363d;
  max-width: 400px;
  text-align: left;
}
.oauth-inputs input {
  width: 100%;
  padding: 10px;
  margin: 8px 0 16px;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #c9d1d9;
  font-size: 14px;
}
.oauth-inputs button {
  width: 100%;
  padding: 10px;
  background: #238636;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
.oauth-inputs button:hover {
  background: #2ea043;
}
</style>
</head>
<body>
<div class="loading" id="status">
  <div class="spinner"></div>
  <p>Обработка авторизации GitHub...</p>
</div>
<script>
// GitHub OAuth callback handler
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');
const errorDesc = params.get('error_description');

if (error) {
  document.getElementById('status').innerHTML = `
    <p class="error">Ошибка авторизации: ${error}</p>
    <p class="error">${errorDesc || ''}</p>
  `;
  setTimeout(() => window.close(), 3000);
}

if (code) {
  // Get OAuth credentials from sessionStorage
  const clientId = sessionStorage.getItem('oauth_client_id');
  const clientSecret = sessionStorage.getItem('oauth_client_secret');
  
  if (!clientId || !clientSecret) {
    document.getElementById('status').innerHTML = `
      <p class="error">OAuth credentials not found in sessionStorage</p>
      <p class="error">Please try logging in again from the main page.</p>
    `;
    setTimeout(() => window.close(), 5000);
  } else {
    document.getElementById('status').innerHTML = `
      <div class="spinner"></div>
      <p>Обмен кода на токен...</p>
    `;
    
    (async () => {
      try {
        const response = await fetch('https://github.com/login/oauth/access_token', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            client_id: clientId,
            client_secret: clientSecret,
            code: code,
            redirect_uri: window.location.origin + '/callback.html'
          })
        });
        
        const data = await response.json();
        
        if (data.access_token) {
          // Send token back to opener
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'github-token', token: data.access_token }, '*');
            document.getElementById('status').innerHTML = '<p class="success">✓ Авторизация успешна! Окно закроется автоматически.</p>';
          } else {
            // Store token in this window's sessionStorage for later use
            sessionStorage.setItem('github_token', data.access_token);
            document.getElementById('status').innerHTML = '<p class="success">✓ Авторизация успешна! Закройте это окно и обновите основную страницу.</p>';
          }
          setTimeout(() => window.close(), 2000);
        } else {
          throw new Error(data.error_description || 'Failed to get access token');
        }
      } catch (e) {
        console.error('Token exchange error:', e);
        document.getElementById('status').innerHTML = `<p class="error">Ошибка: ${e.message}</p>`;
        setTimeout(() => window.close(), 5000);
      }
    })();
  }
}
</script>
</body>
</html>
